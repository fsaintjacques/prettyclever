[workspace]
resolver = "2"
members = ["crates/clever-core", "crates/clever-pretty", "crates/clever-twice"]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/fsaintjacques/prettyclever"

[workspace.dependencies]
arrayvec = { version = "0.7", default-features = false }
rand_core = { version = "0.9", default-features = false }
rand_xoshiro = "0.7"
thiserror = "2"
proptest = "1"
